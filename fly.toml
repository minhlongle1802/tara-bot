# fly.toml app configuration file generated for tara-bot-long on 2026-05-18T20:45:34Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tara-bot-long'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
  size = 'shared-cpu-1x'
